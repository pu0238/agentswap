<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentSwap logo</title>
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url("../deck/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../deck/fonts/geist-mono-500.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 1200px; background: #DCD3C6; overflow: hidden; }
  .wrap { position: absolute; inset: 64px; display: flex; flex-direction: column; gap: 28px; color: #121212; font-family: "Archivo", sans-serif; }
  .panel { position: relative; flex: 1; background: #121212; border: 4px solid #121212; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 0; right: 0; bottom: 0; background: #14F195; color: #121212; font-family: "Geist Mono", monospace; font-size: 30px; padding: 16px 26px; text-transform: uppercase; letter-spacing: .02em; }
  .word { font-weight: 900; font-stretch: 125%; letter-spacing: -0.045em; font-size: 128px; line-height: .82; text-transform: uppercase; white-space: nowrap; }
  .row { display: flex; justify-content: space-between; align-items: center; font-family: "Geist Mono", monospace; font-size: 30px; text-transform: uppercase; }
  .bars { width: 240px; height: 44px; background: repeating-linear-gradient(90deg,#121212 0 3px,transparent 3px 6px,#121212 6px 8px,transparent 8px 14px,#121212 14px 20px,transparent 20px 22px,#121212 22px 24px,transparent 24px 30px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <canvas id="c" width="1064" height="740"></canvas>
    <div class="tag">x402 ✦ Jupiter ✦ Solana ✦ non-custodial</div>
  </div>
  <div class="word">AgentSwap</div>
  <div class="row"><span>Swaps for AI agents</span><span class="bars"></span></div>
</div>
<script src="../../videos/agentswap-demo/assets/vendor/three.min.js"></script>
<script>
  const T = THREE, canvas = document.getElementById("c");
  const VS = "uniform float uTime; varying vec3 vN; varying vec3 vV;" +
    "float arm(vec3 d, vec3 a){ float c = max(dot(d, normalize(a)), 0.0); return 1.3*pow(c, 12.0); }" +
    "vec3 shape(vec3 d){ d = normalize(d); float r = 0.36 + arm(d, vec3(1.,1.,1.)) + arm(d, vec3(1.,-1.,-1.)) + arm(d, vec3(-1.,1.,-1.)) + arm(d, vec3(-1.,-1.,1.)); return d * r; }" +
    "void main(){ vec3 d = normalize(position); vec3 up = abs(d.y) < 0.99 ? vec3(0.,1.,0.) : vec3(1.,0.,0.); vec3 t = normalize(cross(d, up)); vec3 b = normalize(cross(d, t)); vec3 p = shape(d), p1 = shape(d + t*0.006), p2 = shape(d + b*0.006); vec3 n = normalize(cross(p1 - p, p2 - p)); if (dot(n, p) < 0.0) n = -n; vec4 mv = modelViewMatrix * vec4(p, 1.0); vN = normalize(normalMatrix * n); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }";
  const FS = "uniform float uTime; varying vec3 vN; varying vec3 vV;" +
    "vec3 pal(float t){ return 0.5 + 0.5*cos(6.2831*(t + vec3(0.0, 0.33, 0.67))); }" +
    "void main(){ vec3 n = normalize(vN), v = normalize(vV); float f = 1.0 - max(dot(n, v), 0.0); vec3 irid = pal(f*1.5 + n.y*0.4 + n.x*0.3 + uTime*0.06); vec3 l = normalize(vec3(0.4, 0.8, 0.6)); float spec = pow(max(dot(reflect(-l, n), v), 0.0), 36.0); vec3 col = irid * (0.55 + 0.55*max(dot(n, l), 0.0)); col = mix(col, vec3(0.06), (1.0 - f) * 0.28); col += spec * 0.9 + pow(f, 3.0) * 0.3; gl_FragColor = vec4(col, 1.0); }";
  const r = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(1064, 740, false);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(30, 1064 / 740, 0.1, 50); cam.position.set(0, -0.55, 8.4);
  const mat = new T.ShaderMaterial({ uniforms: { uTime: { value: 6.0 } }, vertexShader: VS, fragmentShader: FS });
  const mesh = new T.Mesh(new T.SphereGeometry(1, 240, 240), mat);
  mesh.rotation.set(1.62, 1.74, 0.86);
  scene.add(mesh);
  document.fonts.ready.then(() => r.render(scene, cam));
  r.render(scene, cam);
</script>
</body>
</html>
